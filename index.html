<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de eBay</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        .search-box { margin-bottom: 30px; }
        input { padding: 10px; width: 60%; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background: #0053a0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #003d73; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; text-align: left; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { max-width: 100%; height: 160px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 14px; margin: 0 0 10px 0; height: 40px; overflow: hidden; }
        .price { font-weight: bold; color: #28a745; font-size: 18px; margin-bottom: 10px; }
        .btn-buy { display: block; text-align: center; background: #e53238; color: white; text-decoration: none; padding: 8px; border-radius: 4px; font-weight: bold; }
        .btn-buy:hover { background: #c5272c; }
        .loading { font-size: 18px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Buscador de Productos en eBay</h1>
    <div class="search-box">
        <input type="text" id="keyword" placeholder="¿Qué producto buscas?" value="iPhone">
        <button onclick="buscarProductos()">Buscar</button>
    </div>

    <div id="loading" class="loading" style="display: none;">Cargando productos de eBay...</div>
    <div id="results" class="grid"></div>
</div>

<script>
    async function buscarProductos() {
        const query = document.getElementById('keyword').value;
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');

        resultsDiv.innerHTML = '';
        loadingDiv.style.display = 'block';

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();

            loadingDiv.style.display = 'none';

            if (data.success && data.items.length > 0) {
                data.items.forEach(item => {
                    const title = item.title;
                    const price = item.price ? `${item.price.value} ${item.price.currency}` : 'Precio no disponible';
                    const image = item.image ? item.image.imageUrl : 'https://via.placeholder.com/150';
                    const itemUrl = item.itemWebUrl;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <img src="${image}" alt="${title}">
                            <h3>${title}</h3>
                        </div>
                        <div>
                            <div class="price">${price}</div>
                            <a href="${itemUrl}" target="_blank" class="btn-buy">Ver en eBay</a>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });
            } else {
                resultsDiv.innerHTML = '<p>No se encontraron productos para esta búsqueda.</p>';
            }
        } catch (error) {
            loadingDiv.style.display = 'none';
            resultsDiv.innerHTML = '<p style="color: red;">Hubo un error al realizar la consulta.</p>';
            console.error(error);
        }
    }

    window.onload = buscarProductos;
</script>

</body>
</html>
