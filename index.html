<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hauss | Importaciones de iPhone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen-button text-cyan-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider text-white">SMART <span class="text-cyan-400">HAUSS</span></h1>
            </div>
            <!-- Filtros de Categoría -->
            <div class="flex flex-wrap gap-2 justify-center" id="filtros-categoria">
                <button onclick="filtrarCategoria('todos')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-cyan-500 text-slate-950 transition active">Todos</button>
                <button onclick="filtrarCategoria('15')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">iPhone 15</button>
                <button onclick="filtrarCategoria('14')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">iPhone 14</button>
                <button onclick="filtrarCategoria('13')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">iPhone 13</button>
                <button onclick="filtrarCategoria('12')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">iPhone 12</button>
                <button onclick="filtrarCategoria('11')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">iPhone 11</button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Banner informativo -->
        <div class="bg-gradient-to-r from-cyan-900/40 to-slate-900 border border-cyan-500/30 rounded-2xl p-6 mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-lg font-bold text-cyan-300 mb-1"><i class="fa-solid fa-bolt mr-2"></i>Catálogo en vivo desde eBay EE.UU.</h2>
                <p class="text-sm text-slate-300">Los precios se calculan con importación directa, comisión y envío incluido.</p>
            </div>
            <div id="estado-carga" class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3 py-1.5 rounded-lg animate-pulse">
                Sincronizando con eBay...
            </div>
        </div>

        <!-- Grilla de Productos -->
        <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Los productos se inyectarán aquí mediante JavaScript -->
        </div>
    </main>

    <!-- Script de lógica y conexión con Vercel -->
    <script>
        let productos = [];

        // Cargar productos al iniciar la página desde tu backend en Vercel
        window.addEventListener('DOMContentLoaded', async () => {
            const estadoCarga = document.getElementById('estado-carga');
            try {
                const response = await fetch('https://importacionesvzla.vercel.app/api/iphones');
                if (!response.ok) throw new Error('Error al conectar con el servidor');
                
                productos = await response.json();
                estadoCarga.textContent = `${productos.length} dispositivos sincronizados`;
                estadoCarga.classList.remove('animate-pulse', 'bg-cyan-500/10', 'text-cyan-400', 'border-cyan-500/20');
                estadoCarga.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
                
                mostrarProductos(productos);
            } catch (error) {
                console.error("Error:", error);
                estadoCarga.textContent = "Error al cargar catálogo en vivo";
                estadoCarga.classList.add('bg-rose-500/10', 'text-rose-400', 'border-rose-500/20');
            }
        });

        function mostrarProductos(lista) {
            const grilla = document.getElementById('grilla-productos');
            grilla.innerHTML = '';

            if (lista.length === 0) {
                grilla.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">No se encontraron productos disponibles.</p>`;
                return;
            }

            lista.forEach(item => {
                // Aplicamos tu lógica de cálculo de importación (Precio base + 7% comisión + $20 envío fijo aproximado)
                const precioFinal = Math.round((item.precioUsd * 1.07) + 20);

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-cyan-500/50 transition duration-300 shadow-xl";
                
                card.innerHTML = `
                    <div class="relative h-48 bg-slate-950 p-4 flex items-center justify-center">
                        <span class="absolute top-3 left-3 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs px-2.5 py-1 rounded-md uppercase font-semibold">${item.condicion}</span>
                        <img src="${item.imagen}" alt="${item.nombre}" class="max-h-full object-contain drop-shadow-md">
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-medium text-sm text-slate-200 line-clamp-2 mb-3" title="${item.nombre}">${item.nombre}</h3>
                        </div>
                        <div>
                            <div class="mb-4">
                                <span class="text-2xl font-black text-white">$${precioFinal}</span>
                                <span class="text-xs text-slate-400 block">Incluye impuestos y envío a Vzla</span>
                            </div>
                            <div class="flex gap-2">
                                <a href="https://wa.me/?text=Hola%20Smart%20Hauss,%20estoy%20interesado%20en%20este%20modelo:%20${encodeURIComponent(item.nombre)}%20con%20precio%20final%20de%20$${precioFinal}" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-center py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2">
                                    <i class="fa-brands fa-whatsapp"></i> Pedir
                                </a>
                                <a href="${item.enlaceEbay}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2.5 rounded-xl text-sm transition flex items-center justify-center" title="Ver en eBay original">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grilla.appendChild(card);
            });
        }

        function filtrarCategoria(cat) {
            // Actualizar estilo visual de botones
            document.querySelectorAll('#filtros-categoria button').forEach(btn => {
                btn.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            });
            event.target.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-cyan-500 text-slate-950 transition active";

            if (cat === 'todos') {
                mostrarProductos(productos);
            } else {
                const filtrados = productos.filter(p => p.categoria === cat);
                mostrarProductos(filtrados);
            }
        }
    </script>
</body>
</html>
