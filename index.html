<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importaciones Venezuela - eBay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #1a1a1a;
        }
        /* Contenedor en cuadrícula para los productos */
        .contenedor-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Tarjeta de producto */
        .tarjeta-producto {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarjeta-producto img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .tarjeta-producto h3 {
            font-size: 16px;
            margin: 10px 0;
            height: 45px;
            overflow: hidden;
        }
        .condicion {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .precio {
            font-size: 18px;
            color: #0070ba;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-comprar {
            background-color: #0070ba;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-comprar:hover {
            background-color: #005ea6;
        }
        .cargando {
            text-align: center;
            font-size: 18px;
            color: #666;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo Global de Importación (eBay a Venezuela)</h1>
        <p>Precios finales calculados con flete e impuestos incluidos</p>
    </header>

    <!-- Contenedor donde se inyectarán los productos de la API -->
    <main class="contenedor-productos">
        <div class="cargando">Cargando catálogo en tiempo real desde eBay...</div>
    </main>

    <script>
        async function cargarCatalogoEbay() {
            const contenedor = document.querySelector('.contenedor-productos');
            
            try {
                // Petición a tu archivo api/iphones.js en Vercel
                const respuesta = await fetch('/api/iphones');
                const productos = await respuesta.json();

                if (!productos || productos.length === 0) {
                    contenedor.innerHTML = '<div class="cargando">No hay productos disponibles en este momento.</div>';
                    return;
                }

                // Limpia el mensaje de carga
                contenedor.innerHTML = '';

                // Dibuja cada producto en la pantalla
                productos.forEach(item => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-producto';
                    
                    tarjeta.innerHTML = `
                        <img src="${item.imagen}" alt="${item.nombre}">
                        <h3>${item.nombre}</h3>
                        <div class="condicion">Condición: ${item.condicion}</div>
                        <div class="precio">Ref: $${item.precioUsd} USD</div>
                        <a href="${item.enlaceEbay}" target="_blank" class="btn-comprar">Ver en eBay</a>
                    `;
                    
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                console.error("Error al obtener los datos:", error);
                contenedor.innerHTML = '<div class="cargando">Hubo un error al cargar el catálogo. Intenta recargar la página.</div>';
            }
        }

        // Ejecutar la función apenas cargue el documento
        document.addEventListener('DOMContentLoaded', cargarCatalogoEbay);
    </script>

</body>
</html>
